name: Deploy to VPS

on:
  push:
    branches:
      - Development  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Copy SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Test SSH connection
      run: ssh -o StrictHostKeyChecking=no dev@43.229.133.7 "echo SSH connected"

    - name: Deploy to VPS
      run: ssh -o StrictHostKeyChecking=no dev@43.229.133.7 "cd /var/www/portfolio && ./deploy.sh"
